name: MVS diagnostics helper

on:
  push:
    branches: [mvs-manifest-helper]

permissions:
  contents: read

jobs:
  diagnose:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/mvs-v0.1.1-vertical-slice
      - uses: actions/setup-python@v7
        with:
          python-version: "3.11"
          cache: pip
      - name: Install verification dependencies
        run: python -m pip install --upgrade pip && python -m pip install -e '.[dev]'
      - name: Run diagnostics
        shell: bash
        run: |
          set +e
          python -m ruff check src tests scripts > ruff-check.log 2>&1
          echo "ruff_check=$?" > summary.txt
          python -m ruff format --check src tests scripts > ruff-format.log 2>&1
          echo "ruff_format=$?" >> summary.txt
          MYPYPATH=src python -m mypy src scripts > mypy.log 2>&1
          echo "mypy=$?" >> summary.txt
          PYTHONPATH=src python -m pytest -q > pytest.log 2>&1
          echo "pytest=$?" >> summary.txt
          PYTHONPATH=src python scripts/verify.py --strict-tools > verify.log 2>&1
          echo "verify=$?" >> summary.txt
          cat summary.txt
      - uses: actions/upload-artifact@v4
        with:
          name: mvs-diagnostics
          path: |
            summary.txt
            ruff-check.log
            ruff-format.log
            mypy.log
            pytest.log
            verify.log
