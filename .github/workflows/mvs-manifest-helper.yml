name: MVS manifest helper

on:
  push:
    branches: [mvs-manifest-helper]

permissions:
  contents: read

jobs:
  manifest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Generate manifest
        run: python scripts/generate_manifest.py --output /tmp/MANIFEST.sha256
      - uses: actions/upload-artifact@v4
        with:
          name: mvs-manifest-helper
          path: /tmp/MANIFEST.sha256
