name: MVS manifest helper

on:
  push:
    branches: [mvs-manifest-helper]

permissions:
  contents: write

jobs:
  manifest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/mvs-v0.1.1-vertical-slice
      - name: Regenerate authoritative manifest
        run: python scripts/generate_manifest.py --write
      - name: Commit manifest only
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add MANIFEST.sha256
          git diff --cached --quiet && exit 0
          git commit -m "chore(mvs): synchronize integrity manifest"
          git push origin HEAD:feat/mvs-v0.1.1-vertical-slice
