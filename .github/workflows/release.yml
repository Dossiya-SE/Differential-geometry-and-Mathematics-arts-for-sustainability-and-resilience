name: Release artifacts

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: quarto-dev/quarto-actions/setup@v2
      - name: Install dependencies
        run: python -m pip install --upgrade pip && python -m pip install -e '.[dev]'
      - name: Verify release source
        run: make verify-ci
      - name: Build documentation
        run: quarto render
      - name: Package source and documentation
        run: |
          git archive --format=zip --output=msr-source.zip HEAD
          tar -czf msr-documentation.tar.gz _site
          sha256sum msr-source.zip msr-documentation.tar.gz > release-checksums.sha256
      - uses: actions/upload-artifact@v4
        with:
          name: msr-release-${{ github.ref_name }}
          path: |
            msr-source.zip
            msr-documentation.tar.gz
            release-checksums.sha256
          if-no-files-found: error
