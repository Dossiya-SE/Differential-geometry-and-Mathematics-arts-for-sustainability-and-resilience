name: Reproducibility

on:
  schedule:
    - cron: "17 3 * * 1"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  reference-experiment:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
      - name: Install dependencies
        run: python -m pip install --upgrade pip && python -m pip install -e '.[dev]'
      - name: Reproduce registered reference experiment
        run: python scripts/run_reference_experiment.py --check | tee MSR-EXP-0001-result.json
      - name: Run numerical and property tests
        run: python -m pytest -q tests/properties tests/numerical
      - uses: actions/upload-artifact@v7
        with:
          name: MSR-EXP-0001-${{ github.sha }}
          path: MSR-EXP-0001-result.json
          if-no-files-found: error
