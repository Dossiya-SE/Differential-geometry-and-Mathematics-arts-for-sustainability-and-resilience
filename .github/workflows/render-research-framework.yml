name: render-research-framework

on:
  push:
    branches: [ main ]
    paths:
      - 'frameworks/research-framework-visual/**'
      - '.github/workflows/render-research-framework.yml'
  pull_request:
    branches: [ main ]
    paths:
      - 'frameworks/research-framework-visual/**'
      - '.github/workflows/render-research-framework.yml'
  workflow_dispatch:
    inputs:
      render_request:
        description: 'Frozen render request'
        required: true
        default: 'render_requests/Research_Framework_V4.yaml'
        type: string

jobs:
  compatibility:
    name: compatibility-${{ matrix.name }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: ubuntu-py311-core
            os: ubuntu-latest
            python: '3.11'
            extras: 'dev'
            doctor_args: '--strict'
          - name: macos-arm64-py313-notebook
            os: macos-latest
            python: '3.13'
            extras: 'dev,notebook'
            doctor_args: '--strict --notebook'
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        working-directory: frameworks/research-framework-visual
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}

      - name: Install and expose native Cairo on macOS
        if: runner.os == 'macOS'
        run: |
          brew list cairo >/dev/null 2>&1 || brew install cairo
          brew list libffi >/dev/null 2>&1 || brew install libffi
          CAIRO_PREFIX="$(brew --prefix cairo)"
          LIBFFI_PREFIX="$(brew --prefix libffi)"
          echo "DYLD_FALLBACK_LIBRARY_PATH=$CAIRO_PREFIX/lib:/opt/homebrew/lib" >> "$GITHUB_ENV"
          echo "PKG_CONFIG_PATH=$CAIRO_PREFIX/lib/pkgconfig:$LIBFFI_PREFIX/lib/pkgconfig" >> "$GITHUB_ENV"
          echo "LDFLAGS=-L$CAIRO_PREFIX/lib -L$LIBFFI_PREFIX/lib" >> "$GITHUB_ENV"
          echo "CPPFLAGS=-I$CAIRO_PREFIX/include -I$LIBFFI_PREFIX/include" >> "$GITHUB_ENV"

      - name: Install compatibility profile
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[${{ matrix.extras }}]"

      - name: Audit runtime identity and dependencies
        run: python -m framework doctor ${{ matrix.doctor_args }}

      - name: Run controller and environment tests
        run: pytest -q

  governed-render:
    needs: compatibility
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frameworks/research-framework-visual
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install governed renderer
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e .[dev]

      - name: Audit governed-render runtime
        run: python -m framework doctor --strict

      - name: Run controller tests
        run: pytest -q

      - name: Render V4 release
        run: |
          REQUEST="${{ github.event.inputs.render_request || 'render_requests/Research_Framework_V4.yaml' }}"
          python -m framework render --request "$REQUEST" --outdir exports

      - name: Independent source-only reproduction
        run: python -m framework reproduce --bundle exports/SOURCE_BUNDLE.zip

      - name: Enforce RENDER_PASS contract
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          out = Path('exports')
          qa = json.loads((out / 'qa_report.json').read_text())
          required = [
              'poster_EDITABLE.svg',
              'poster_EDITABLE.pptx',
              'poster.png',
              'poster.pdf',
              'render_request.yaml',
              'equations.tex',
              'research_data.json',
              'manifest.json',
              'qa_report.json',
              'SOURCE_BUNDLE.zip',
          ]
          missing = [name for name in required if not (out / name).exists()]
          assert not missing, f'Missing required artifacts: {missing}'
          assert qa['final_status'] == 'RENDER_PASS', qa
          assert all(qa['gates'].values()), qa['gates']
          print('RENDER_PASS — all fail-closed gates satisfied')
          PY

      - name: Upload editable research release
        uses: actions/upload-artifact@v4
        with:
          name: research-framework-v4-${{ github.sha }}
          path: frameworks/research-framework-visual/exports/
          if-no-files-found: error
