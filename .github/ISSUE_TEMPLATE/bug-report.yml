name: Reproducibility or software defect
description: Report an incorrect result, failed check, broken document, or unsafe behavior.
title: "defect: "
labels: [defect]
body:
  - type: input
    id: version
    attributes:
      label: Repository version or commit
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected contract or behavior
    validations:
      required: true
  - type: textarea
    id: observed
    attributes:
      label: Observed behavior and complete error
    validations:
      required: true
  - type: textarea
    id: reproduction
    attributes:
      label: Minimal reproduction
      description: Include command, environment, inputs, seed, precision, and relevant IDs.
    validations:
      required: true
  - type: textarea
    id: impact
    attributes:
      label: Research, security, or interpretation impact
    validations:
      required: true
