[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "research-framework-visual"
version = "0.1.0"
description = "Automated rendering pipeline for a mathematical-computational research framework poster"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
  "matplotlib>=3.8",
  "numpy>=1.26",
  "Pillow>=10.0",
  "PyYAML>=6.0"
]

[project.optional-dependencies]
dev = ["pytest>=8.0"]

[project.scripts]
framework = "framework.cli:main"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]
