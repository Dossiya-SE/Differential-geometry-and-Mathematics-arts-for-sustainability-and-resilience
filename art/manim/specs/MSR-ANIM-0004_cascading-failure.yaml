schema_version: 1.0.0
id: MSR-ANIM-0004
title: Cascading failure
status: SPECIFIED
renderer_status: CANDIDATE_READY
evidence_state: PROPOSED
scientific_question: How can a load-capacity cascade be animated so that topology, capacity assumptions, failure rules, and redistribution are all inspectable?
mathematical_object:
  name: Capacity-constrained graph cascade
  state_space: G=(V,E); L,C in R^|V|
  equations:
  - C_i = (1 + alpha_i) L_i^0
  - L_i(t) > C_i implies failed_i(t+1)=1
  - L(t+1) = T(G,failed(t),L(t))
assumptions:
- The redistribution operator T must be declared for each experiment.
- Failure thresholds are model parameters, not observed facts unless sourced.
- A topological cascade is not automatically a physical cascading-failure mechanism.
sustainability_interpretation:
  claim: A declared cascade model can expose how assumed capacities and redistribution rules produce system-level connectivity or service loss.
  boundary: The output is conditional on the chosen cascade model and cannot be generalized to infrastructure without validation.
visual_encodings:
- semantic: active node
  mathematical_source: failed_i=0
  invariant: node state equals cascade state vector
  non_color_cue: solid circle
- semantic: failed node
  mathematical_source: failed_i=1
  invariant: failure only occurs when declared rule is triggered
  non_color_cue: cross marker and FAILED label
- semantic: load-capacity ratio
  mathematical_source: L_i/C_i
  invariant: displayed ratio equals model value
  non_color_cue: numeric ratio and radial gauge
motion_semantics:
- type: FAILURE_PROPAGATION
  meaning: Node state changes follow threshold evaluation and the declared redistribution operator.
validation:
  mathematical_invariants:
  - No node fails before the declared criterion is met.
  - Displayed load, capacity, and failure states agree with the model at every frame checkpoint.
  determinism: Fixed parameters and seeds must produce the same scene-level mathematical state.
  visual_semantics: Every visible primitive must map to a declared mathematical or evidence semantic.
  accessibility: Static fallback, alternative text, reduced motion, and non-color cues are required.
  provenance: Rendered artifacts must retain spec, model, experiment, renderer, environment, and output hashes.
accessibility:
  alt_text: A network changes step by step as labeled load-capacity ratios exceed thresholds; failed nodes use cross marks and redistribution arrows show the declared rule.
  static_fallback: true
  reduced_motion: true
  color_independent: true
provenance:
  program_id: MSR-VM-001
  visual_standard_id: MSR-VIS-001
  model_contracts: []
  experiment_ids: []
  source_references:
  - docs/VISUAL_MATHEMATICS_RESEARCH_PROGRAM.md
