schema_version: 1.0.0
id: MSR-ANIM-0006
title: Geometric resilience distance
status: SPECIFIED
renderer_status: CANDIDATE_READY
evidence_state: PROPOSED
scientific_question: How can metric distance from a state to a viability boundary be defined and visualized without claiming that geometric distance is automatically empirical resilience?
mathematical_object:
  name: Riemannian distance to the boundary of a viable set
  state_space: (M,g); V subset M
  equations:
  - L_g(gamma) = integral_0^1 sqrt(g_gamma(t)(gamma_dot,gamma_dot)) dt
  - d_g(p,q) = inf_gamma L_g(gamma)
  - rho_g(x) = d_g(x, boundary V)
assumptions:
- The metric g is a declared positive-definite model on the displayed region.
- The viability boundary is defined independently of the renderer.
- A shortest displayed path is called geodesic only after numerical or analytic verification.
sustainability_interpretation:
  claim: A state-dependent metric can define a geometric margin to a declared viability boundary and expose anisotropic notions of proximity.
  boundary: rho_g is a mathematical margin; interpreting it as resilience requires separate theoretical and empirical validation.
visual_encodings:
- semantic: metric geometry
  mathematical_source: g(x)
  invariant: local glyphs encode the declared metric tensor
  non_color_cue: oriented metric ellipses with axes
- semantic: viability boundary
  mathematical_source: boundary V
  invariant: boundary coordinates derive from the viability representation
  non_color_cue: thick labeled contour
- semantic: shortest path
  mathematical_source: argmin of L_g from x to boundary V
  invariant: path length and endpoint satisfy the declared optimization tolerance
  non_color_cue: solid path with length label rho_g
motion_semantics:
- type: OPTIMIZATION_ITERATION
  meaning: Candidate paths may update as the geodesic or boundary-distance solver minimizes metric length.
- type: CAMERA_EXPOSITION
  meaning: Camera motion may reveal curvature but does not change metric or state.
validation:
  mathematical_invariants:
  - Metric matrices are symmetric positive definite at sampled points.
  - Reported rho_g equals the validated path length within tolerance.
  - Endpoint lies on the declared boundary within tolerance.
  determinism: Fixed parameters and seeds must produce the same scene-level mathematical state.
  visual_semantics: Every visible primitive must map to a declared mathematical or evidence semantic.
  accessibility: Static fallback, alternative text, reduced motion, and non-color cues are required.
  provenance: Rendered artifacts must retain spec, model, experiment, renderer, environment, and output hashes.
accessibility:
  alt_text: Metric ellipses deform across a curved state surface; a solid shortest path connects a state point to a labeled viability boundary and reports its metric length.
  static_fallback: true
  reduced_motion: true
  color_independent: true
provenance:
  program_id: MSR-VM-001
  visual_standard_id: MSR-VIS-001
  model_contracts: []
  experiment_ids: []
  source_references:
  - docs/VISUAL_MATHEMATICS_RESEARCH_PROGRAM.md
