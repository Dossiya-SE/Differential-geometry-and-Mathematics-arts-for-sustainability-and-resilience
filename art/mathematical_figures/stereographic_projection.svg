  <title id="title">Stereographic projection of a sphere onto an equatorial plane</title>
  <desc id="description">An orthographic schematic of a unit sphere, equatorial plane, the north pole N, sphere point P, and its planar image Q. N, Q and P are collinear. The map is undefined at N and does not preserve intrinsic distances.</desc>
  <rect x="0" y="0" width="1310" height="720" fill="#FFFFFF"/>
  <text x="58" y="65" font-family="system-ui" font-size="31" font-weight="700" fill="#17202A">Stereographic projection from S² to a plane</text>
  <text x="58" y="103" font-family="system-ui" font-size="19" fill="#5D6D7E">Orthographic drawing of a 3D construction · displayed lengths are not intrinsic distances</text>
