  repo-url: "https://github.com/Dossiya-SE/Differential-geometry-and-Mathematics-arts-for-sustainability-and-resilience"
  repo-actions: [source, issue]
  navbar:
    left:
      - href: docs/index.qmd
        text: Home
      - href: docs/architecture.qmd
        text: Architecture
      - href: docs/learning.qmd
        text: Learning laboratory
      - href: docs/toolchain.qmd
        text: Toolchain
      - href: docs/aurora-scientific-visualization.qmd
